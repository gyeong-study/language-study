function keys(){
  if(KEYS)return KEYS;
  KEYS=Object.keys(TBL).filter(function(k){return k.length>=6&&HANGUL.test(k)}).sort(function(a,b){return b.length-a.length});
  return KEYS;
}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function nameOf(ko){var n=NAMES[ko];return n?(n[LANG]||ko):ko}
function pick(arr){var v=arr[IDX[LANG]];return v}
function exact(s){
  var h=TBL[s];
  if(h!==undefined){var v=pick(h);if(v!==undefined)return v}
  var c=CAT[s];
  if(c!==undefined){var v2=pick(c);if(v2!==undefined)return v2}
  return null;
}
function tpl(s){
  var L=[],N=[],F=[];
  var key=s.replace(/[\u{1F1E6}-\u{1F1FF}]{2}/gu,function(m){F.push(m);return"{F}"})
           .replace(/(한국어|영어|일본어|중국어|베트남어)/g,function(m){L.push(m);return"{L}"})
           .replace(/\d+(?:\.\d+)?/g,function(m){N.push(m);return"{N}"});
  if(key===s)return null;
  var h=TPL[key];if(!h)return null;
  var out=pick(h);if(out===undefined)return null;
  out=out.replace(/\{(L|N|F)(\d)(\^?)\}/g,function(_,t,i,c){
    var arr=t==="L"?L:t==="N"?N:F,v=arr[+i-1];
    if(v===undefined)return"";
    if(t==="L"){v=nameOf(v);if(c)v=cap(v)}
    return v;
  });
  return out;
}
function segment(s){
  if(s.length<12||!HANGUL.test(s))return null;
  var ks=keys(),work=s,subs=[],any=false;
  for(var i=0;i<ks.length;i++){
    var k=ks[i];
    if(work.indexOf(k)<0)continue;
    var v=exact(k);if(v===null)continue;
    var tok="\u0001"+subs.length+"\u0002";
    work=work.split(k).join(tok);subs.push(v);any=true;
  }
  if(!any)return null;
  if(HANGUL.test(work.replace(/\u0001\d+\u0002/g,"")))return null;
  return work.replace(/\u0001(\d+)\u0002/g,function(_,i){return subs[+i]});
