        :root{ --blue:#6366f1; --blue2:#2563eb; --bg:#f6f7fb; --card:#ffffff; --line:#e6e8f0; --text:#101828; --muted:#667085; --radius:20px; }
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Noto Sans KR",sans-serif;width:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
        button,input,textarea,select{font:inherit}
        button{cursor:pointer;-webkit-tap-highlight-color:transparent}
        .app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:100px;background:linear-gradient(180deg,#f8f9ff 0%,#ffffff 35%);position:relative}
        header{background:rgba(255,255,255,0.86);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-bottom:1px solid rgba(230,232,240,0.9);padding:14px 16px;padding-top:calc(14px + var(--safe-area-inset-top, 0px));position:sticky;top:0;z-index:20}
        .header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

        .title-wrap h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-0.4px}
        .title-wrap .sub{font-size:11px;color:var(--muted);font-weight:600}
        .lang-selector{display:flex;gap:4px;background:#eef0f6;padding:3px;border-radius:12px}
        .lang-btn{border:0;background:transparent;color:#667085;font-size:11px;font-weight:700;padding:6px 9px;border-radius:9px;transition:0.18s}
        .lang-btn.active{background:#fff;color:#101828;box-shadow:0 1px 3px rgba(16,24,40,0.08),0 0 0 1px rgba(16,24,40,0.04)}
        .header-sub{display:flex;justify-content:space-between;align-items:center}
        .header-sub p{margin:0;font-size:11px;color:#667085;font-weight:500}
        .api-badge{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;white-space:nowrap;letter-spacing:-0.2px}
        .api-badge.ok{background:#e0e7ff;border-color:#a5b4fc;color:#3730a3}
        .api-badge.warn{background:#fef9c3;border-color:#fde68a;color:#854d0e}
        .api-badge.err{background:#fee2e2;border-color:#fecaca;color:#991b1b}
        main{padding:14px 14px 0}
        .screen{display:none}.screen.active{display:block}
        .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,0.04),0 8px 24px rgba(16,24,40,0.06)}
        h2{font-size:15px;margin:0 0 10px;font-weight:800;letter-spacing:-0.3px}
        .label{font-size:12px;font-weight:700;color:#344054;margin-bottom:6px;letter-spacing:-0.1px}
        textarea,input,select{width:100%;border:1px solid #e6e8f0;border-radius:14px;padding:12px 13px;background:#fcfcfd;outline:none;font-size:15px;transition:0.18s;box-shadow:inset 0 1px 0 rgba(255,255,255,0.8)}
        textarea:focus,input:focus,select:focus{border-color:#a5b4fc;background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,0.12)}
        textarea{min-height:92px;resize:vertical;line-height:1.5}
        .switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#eef0f6;padding:4px;border-radius:14px;margin-bottom:12px}
        .switch button{border:0;border-radius:11px;padding:10px 5px;background:transparent;color:#667085;font-weight:700;font-size:13px;transition:0.18s}
        .switch button.active{background:#fff;color:#101828;box-shadow:0 1px 4px rgba(16,24,40,0.08),0 0 0 1px rgba(16,24,40,0.04)}
        .row{display:flex;gap:8px;flex-wrap:wrap}
        .row>*{flex:1;min-width:80px}
